services:
  - type: web
    name: neurostack-ai-layer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: MISTRAL_EMBED_MODEL
        value: mistral-embed
      - key: ZVEC_BASE_PATH
        value: /tmp/zvec-data
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        value: "mongodb+srv://tchuwe41_db_user:0A3PBsdlT4BxYxUi@cluster0.ni7eeml.mongodb.net/?appName=Cluster0"
      - key: MONGODB_DB_NAME
        value: "e-lms"
